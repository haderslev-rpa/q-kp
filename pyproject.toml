[project]
name = "q-kp"
version = "0.1.0"
description = "Object til Kommunernes Pensionssystem"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.59.0",
    "automation-server-client",
    "q-haderslev-vbo",
]

[tool.uv.sources]
automation-server-client = { git = "https://github.com/odense-rpa/automation-server-client.git", tag = "v0.3.0" }
q-haderslev-vbo = { git = "https://github.com/haderslev-rpa/q-haderslev-vbo.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["q_kp"]